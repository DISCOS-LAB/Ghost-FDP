# Ghost-FDP AutoStream (autoStream.py loads this file next to itself).

[autostream]
# Userspace dump / heartbeat interval (seconds). SFR itself is per-I/O.
window_size = 300
# LBA chunk size (bytes). 1 MiB = 1048576.
chunk_size = 1048576
# Number of FDP placement identifiers (PI0 .. PI{n-1}).
fdp_pi_num = 5
# Dump per-window PI CSV (out/infer/piN.csv) and track pi_write_count[].
dump_pi_counts = false
# SFR decay period (seconds). access_cnt halves every decay_period of idle time.
decay_period = 300
