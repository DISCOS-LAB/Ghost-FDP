# Ghost-FDP steering (inference.py loads this file next to itself).

[inference]
# Hazard / PI-threshold observation window (seconds).
window_size = 300
# LBA chunk size (bytes). 1 MiB = 1048576.
chunk_size = 1048576
# Number of FDP placement identifiers (PI0 .. PI{n-1}).
fdp_pi_num = 5
# Dump per-window hazard CSV (out/infer/hazardN.csv) and track pi_write_count[].
dump_pi_counts = false
# Cox PH coefficients: upd_freq_log1p, last_int_s_log1p.
coef_upd_freq = 0.818430
coef_last_int_s_log1p = -0.225678
